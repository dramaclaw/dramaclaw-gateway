# Keeps the Docker Hub overview of claymorelab/dramaclaw-gateway in sync with
# docs/dockerhub/README.md. Runs on pushes to main that touch that file, and on
# demand. Uses the same DOCKERHUB_* secrets as docker-build.yml; never runs on
# pull_request triggers so PR code can't reach the secrets.
name: Sync Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub/README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: claymorelab/dramaclaw-gateway
          short-description: OpenAI-compatible model gateway bundled with DramaClaw CE (DC-Media, New API fork)
          readme-filepath: docs/dockerhub/README.md
