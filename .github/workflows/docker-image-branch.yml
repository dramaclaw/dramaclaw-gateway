name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (e.g. alpha, nightly)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: [dramaclaw-gateway-build]
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Resolve Docker tags
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          TAG_PREFIX=${TAG_PREFIX:0:105}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::Branch '$BRANCH_NAME' cannot be converted to a valid Docker tag prefix"
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${SHORT_SHA}"

          {
            echo "branch=$BRANCH_NAME"
            echo "sha=$SHA"
            echo "tag_prefix=$TAG_PREFIX"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared Docker tags for $BRANCH_NAME at $SHORT_SHA"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: [dramaclaw-gateway-build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Publishing version: ${{ needs.prepare.outputs.version }} for ${{ matrix.arch }}"

      - name: Enable ARM64 emulation on the x64 runner
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up persistent Linux builder
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: ${{ runner.name }}
          buildkitd-flags: --allow-insecure-entitlement network.host
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
            memory=3g
            memory-swap=3g
            cpu-quota=400000
            cpu-period=100000
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.lingshan.ai"]
            [worker.oci]
              max-parallelism = 1
              gc = true
              reservedSpace = "10GB"
              maxUsedSpace = "100GB"
              minFreeSpace = "50GB"
          keep-state: true
          cache-binary: false

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            calciumion/new-api

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            calciumion/new-api:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes calciumion/new-api@${{ steps.build.outputs.digest }}

      - name: Output digest
        run: |
          {
            echo "### Docker Image Digest (${{ matrix.arch }})"
            echo '```'
            echo "calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}"
            echo "calciumion/new-api:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [prepare, build_single_arch]
    runs-on: [dramaclaw-gateway-build]
    permissions:
      id-token: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - branch)
        run: |
          docker buildx imagetools create \
            -t calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }} \
            calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}-amd64 \
            calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}-arm64

      - name: Create & push manifest (Docker Hub - versioned)
        run: |
          docker buildx imagetools create \
            -t calciumion/new-api:${{ needs.prepare.outputs.version }} \
            calciumion/new-api:${{ needs.prepare.outputs.version }}-amd64 \
            calciumion/new-api:${{ needs.prepare.outputs.version }}-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}
          cosign sign --yes calciumion/new-api:${{ needs.prepare.outputs.version }}

      - name: Output manifest digest
        run: |
          {
            echo "### Multi-arch Manifest Digests"
            echo '```'
            docker buildx imagetools inspect calciumion/new-api:${{ needs.prepare.outputs.tag_prefix }}
            echo "---"
            docker buildx imagetools inspect calciumion/new-api:${{ needs.prepare.outputs.version }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
